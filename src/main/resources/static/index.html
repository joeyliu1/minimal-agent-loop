<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Loop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════ CRT Terminal Theme ═══════════════════ */
        :root {
            --bg: #1a1a1e;
            --bg-panel: #222228;
            --bg-hover: #2a2a32;
            --border: #3a3a42;
            --border-dim: #303038;

            --fg: #f0e8d8;
            --fg-dim: #a09888;
            --fg-muted: #706858;

            --accent-user: #7be0a0;
            --accent-user-dim: rgba(123,224,160,0.12);
            --accent-agent: #7cc8e8;
            --accent-agent-dim: rgba(124,200,232,0.12);
            --accent-warn: #e8c878;
            --accent-error: #e88888;

            --glow-user: 0 0 8px rgba(123,224,160,0.3);
            --glow-agent: 0 0 8px rgba(124,200,232,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.7;
            color: var(--fg);
            background: var(--bg);
            overflow: hidden;
        }

        /* ── CRT Scanlines ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.04) 2px,
                rgba(0,0,0,0.04) 4px
            );
            opacity: 0.6;
        }

        /* ── Layout ── */
        .app {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ═══════════ Sidebar ═══════════ */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--bg-panel);
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--fg);
        }

        .sidebar-header .tagline {
            font-size: 10px;
            color: var(--fg-dim);
            margin-top: 4px;
            letter-spacing: 0.08em;
        }

        .new-chat-btn {
            margin: 12px 20px;
            padding: 10px 14px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--accent-user);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .new-chat-btn:hover {
            border-color: var(--accent-user);
            background: var(--accent-user-dim);
            box-shadow: var(--glow-user);
        }
        .new-chat-btn::before { content: '>'; margin-right: 8px; }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 16px;
        }
        .session-list::-webkit-scrollbar { width: 3px; }
        .session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 0; }

        .session-item {
            padding: 10px 12px;
            margin-bottom: 2px;
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: all 0.15s ease;
            position: relative;
        }
        .session-item:hover { background: var(--bg-hover); }
        .session-item.active {
            background: var(--bg-hover);
            border-left-color: var(--accent-user);
        }
        .session-item .title {
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--fg);
        }
        .session-item.active .title { color: var(--accent-user); }
        .session-item .meta {
            font-size: 10px;
            color: var(--fg-dim);
            margin-top: 2px;
            display: flex;
            justify-content: space-between;
        }
        .session-del {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            display: grid;
            place-items: center;
            color: var(--fg-dim);
            font-size: 11px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        .session-item:hover .session-del { opacity: 1; }
        .session-del:hover { color: var(--accent-error); }

        .empty-sessions {
            text-align: center;
            padding: 40px 20px;
            color: var(--fg-dim);
            font-size: 11px;
        }

        /* ═══════════ Main ═══════════ */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* ── Status Bar ── */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            letter-spacing: 0.05em;
            color: var(--fg-dim);
        }
        .status-bar .left { display: flex; gap: 24px; }
        .status-bar .item { display: flex; align-items: center; gap: 6px; }
        .status-bar .label { color: var(--fg-muted); }
        .status-bar .led {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent-user);
            box-shadow: var(--glow-user);
            animation: led-pulse 2.5s ease-in-out infinite;
        }
        @keyframes led-pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* ── Chat Area ── */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .chat-area::-webkit-scrollbar { width: 4px; }
        .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 0; }

        .msg-row {
            display: flex;
            gap: 10px;
            padding: 8px 0;
            animation: msg-in 0.3s ease forwards;
            opacity: 0;
            transform: translateX(-8px);
        }
        @keyframes msg-in {
            to { opacity: 1; transform: translateX(0); }
        }
        .msg-row.user { --accent: var(--accent-user); --glow: var(--glow-user); }
        .msg-row.agent { --accent: var(--accent-agent); --glow: var(--glow-agent); }

        .msg-prompt {
            flex-shrink: 0;
            font-size: 12px;
            color: var(--fg-muted);
            user-select: none;
            width: 24px;
            text-align: right;
        }
        .msg-row.user .msg-prompt { color: var(--accent-user); }
        .msg-row.agent .msg-prompt { color: var(--accent-agent); }

        .msg-content {
            flex: 1;
            font-size: 13px;
            line-height: 1.8;
            color: var(--fg);
        }
        .msg-content code {
            background: rgba(255,255,255,0.08);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            color: var(--accent-warn);
        }
        .msg-content pre {
            background: rgba(255,255,255,0.05);
            padding: 14px 18px;
            margin: 10px 0;
            overflow-x: auto;
            border-left: 3px solid var(--accent-agent);
            border-radius: 0 6px 6px 0;
            font-size: 12px;
            line-height: 1.6;
        }
        .msg-content strong {
            color: var(--accent-user);
            font-weight: 600;
        }
        .msg-content em {
            color: var(--accent-agent);
            font-style: italic;
        }
        .msg-content ul, .msg-content ol {
            margin: 8px 0;
            padding-left: 20px;
        }
        .msg-content li {
            margin: 4px 0;
        }
        .msg-content h1, .msg-content h2, .msg-content h3 {
            margin: 12px 0 8px;
            color: var(--accent-agent);
            font-weight: 600;
        }
        .msg-content h1 { font-size: 16px; }
        .msg-content h2 { font-size: 15px; }
        .msg-content h3 { font-size: 14px; }
        .msg-content p {
            margin: 6px 0;
        }

        .msg-ts {
            flex-shrink: 0;
            font-size: 10px;
            color: var(--fg-muted);
            user-select: none;
            padding-top: 2px;
        }

        .welcome-msg {
            padding: 40px 0;
            text-align: center;
            color: var(--fg-muted);
            font-size: 12px;
            border-bottom: 1px solid var(--border-dim);
            margin-bottom: 16px;
        }
        .welcome-msg .prompt {
            color: var(--accent-agent);
            margin-bottom: 8px;
            font-size: 14px;
        }

        /* ── Typing indicator ── */
        .typing-row {
            display: flex;
            gap: 10px;
            padding: 8px 0;
            opacity: 0;
            animation: msg-in 0.2s ease forwards;
        }
        .typing-text {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--accent-agent);
        }
        .typing-text span {
            display: inline-block;
            width: 4px; height: 4px;
            background: var(--accent-agent);
            animation: typing-dot 1.2s ease-in-out infinite;
        }
        .typing-text span:nth-child(1) { animation-delay: 0s; }
        .typing-text span:nth-child(2) { animation-delay: 0.2s; }
        .typing-text span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing-dot {
            0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
            40% { opacity: 1; transform: scale(1.3); }
        }

        /* ═══════════ Input ═══════════ */
        .input-bar {
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .input-prompt {
            color: var(--accent-user);
            font-size: 14px;
            font-weight: 500;
            flex-shrink: 0;
            animation: cursor-blink 1s step-end infinite;
        }
        @keyframes cursor-blink { 50% { opacity: 0; } }
        #msgInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--fg);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        #msgInput::placeholder { color: var(--fg-muted); }
        .send-btn {
            width: 28px; height: 28px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--fg-dim);
            cursor: pointer;
            display: grid;
            place-items: center;
            font-size: 12px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .send-btn:hover {
            border-color: var(--accent-user);
            color: var(--accent-user);
            box-shadow: var(--glow-user);
        }

        /* ═══════════ Toast ═══════════ */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 80px;
            transform: translateX(-50%) translateY(20px);
            padding: 8px 20px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--fg);
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 100;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { color: var(--accent-error); border-color: var(--accent-error); }

        /* ═══════════ Confirm Dialog ═══════════ */
        .dialog-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .dialog-overlay.show { display: flex; }
        .dialog-box {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 28px 32px 20px;
            min-width: 300px;
        }
        .dialog-body {
            font-size: 13px;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .dialog-actions { display: flex; gap: 12px; justify-content: flex-end; }
        .dialog-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--fg);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .dialog-btn:hover { border-color: var(--accent-user); color: var(--accent-user); }
        .dialog-btn.primary { color: var(--accent-user); border-color: var(--accent-user); }
        .dialog-btn.primary:hover { background: var(--accent-user-dim); }

        /* ═══════════ Mobile ═══════════ */
        .mobile-toggle {
            display: none;
            width: 32px; height: 32px;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--fg);
            cursor: pointer;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0; top: 0; bottom: 0;
                z-index: 50;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.open { transform: translateX(0); }
            .mobile-toggle { display: flex; }
            .status-bar { padding: 10px 16px; }
            .chat-area { padding: 16px; }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>Agent Loop</h1>
            <div class="tagline">ReAct-style Agent</div>
        </div>
        <button class="new-chat-btn" id="newChatBtn">new_chat</button>
        <div class="session-list" id="sessionList"></div>
    </aside>

    <!-- Main -->
    <div class="main">
        <div class="status-bar">
            <div class="left">
                <div class="item">
                    <span class="led"></span>
                    <span>SYSTEM_READY</span>
                </div>
                <div class="item">
                    <span class="label">session:</span>
                    <span id="statusSession">--</span>
                </div>
            </div>
            <div class="right">
                <button class="mobile-toggle" id="menuToggle">≡</button>
                <button class="mobile-toggle" id="clearBtn" style="margin-left:8px" title="清空">×</button>
            </div>
        </div>

        <div class="chat-area" id="chatArea"></div>

        <div class="input-bar">
            <span class="input-prompt">&gt;</span>
            <input id="msgInput" type="text" placeholder="Type a message..." autocomplete="off" autofocus>
            <button class="send-btn" id="sendBtn" title="发送">↵</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Confirm Dialog -->
<div class="dialog-overlay" id="dialogOverlay">
    <div class="dialog-box">
        <div class="dialog-body" id="dialogBody"></div>
        <div class="dialog-actions">
            <button class="dialog-btn" id="dialogCancel">cancel</button>
            <button class="dialog-btn primary" id="dialogOk">confirm</button>
        </div>
    </div>
</div>

<script>
(function() {
    var isLoading = false;
    var currentSessionId = null;
    var messages = [];

    function genId() { return 's-' + Date.now(); }
    function now() { var d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }

    // ── Render ──
    function renderChat() {
        var area = document.getElementById('chatArea');
        if (messages.length === 0) {
            area.innerHTML = '<div class="welcome-msg"><div class="prompt">$ Agent Loop v1.0</div><div>Ready for input. Type a message to begin.</div></div>';
            return;
        }
        var html = '';
        for (var i = 0; i < messages.length; i++) {
            var m = messages[i];
            var prompt = m.type === 'user' ? '>' : '◆';
            var ts = m.ts || now();
            html += '<div class="msg-row ' + m.type + '">' +
                '<span class="msg-prompt">' + prompt + '</span>' +
                '<span class="msg-content">' + formatContent(m.content) + '</span>' +
                '<span class="msg-ts">' + ts + '</span>' +
            '</div>';
        }
        area.innerHTML = html;
        area.scrollTop = area.scrollHeight;
    }

    function addMessage(content, type) {
        messages.push({ type: type, content: content, ts: now() });
        renderChat();
    }

    // ── Send ──
    function sendMessage() {
        var input = document.getElementById('msgInput');
        var text = input.value.trim();
        if (!text || isLoading) return;
        if (!currentSessionId) currentSessionId = genId();

        addMessage(text, 'user');
        input.value = '';
        setLoading(true);

        fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, sessionId: currentSessionId })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            typewriterEffect(data.response || 'Error: no response');
        })
        .catch(function(err) {
            addMessage('Error: ' + err.message, 'agent');
        })
        .finally(function() {
            setLoading(false);
            refreshSessions();
        });
    }

    // ── Typewriter effect ──
    function typewriterEffect(text) {
        var area = document.getElementById('chatArea');
        var ts = now();
        var contentSpan = document.createElement('span');
        contentSpan.className = 'msg-content';

        var row = document.createElement('div');
        row.className = 'msg-row agent';
        row.innerHTML = '<span class="msg-prompt">◆</span>';
        row.appendChild(contentSpan);
        var tsSpan = document.createElement('span');
        tsSpan.className = 'msg-ts';
        tsSpan.textContent = ts;
        row.appendChild(tsSpan);
        area.appendChild(row);
        area.scrollTop = area.scrollHeight;

        var i = 0;
        var speed = 15;
        function type() {
            if (i < text.length) {
                contentSpan.textContent += text.charAt(i);
                i++;
                area.scrollTop = area.scrollHeight;
                setTimeout(type, speed);
            } else {
                messages.push({ type: 'agent', content: text, ts: ts });
            }
        }
        type();
    }

    function setLoading(loading) {
        isLoading = loading;
        document.getElementById('sendBtn').disabled = loading;
        var area = document.getElementById('chatArea');
        if (loading) {
            var row = document.createElement('div');
            row.className = 'typing-row';
            row.innerHTML = '<span class="msg-prompt">◆</span><div class="typing-text"><span></span><span></span><span></span>thinking...</div>';
            area.appendChild(row);
            area.scrollTop = area.scrollHeight;
        } else {
            var t = area.querySelector('.typing-row');
            if (t) t.remove();
        }
    }

    // ── Sessions ──
    function newChat() {
        currentSessionId = genId();
        messages = [];
        renderChat();
        updateStatus();
        refreshSessions();
        closeSidebar();
    }
    function switchSession(id) {
        currentSessionId = id;
        fetch('/api/sessions/' + encodeURIComponent(id) + '/messages')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                messages = (data.messages || []).map(function(m) {
                    return { type: m.role === 'user' ? 'user' : 'agent', content: m.content };
                });
                renderChat();
                updateStatus();
            })
            .catch(function() { messages = []; renderChat(); });
        refreshSessions();
        closeSidebar();
    }
    async function deleteSession(id) {
        if (!await showConfirm('delete session?')) return;
        fetch('/api/sessions?sessionId=' + encodeURIComponent(id), { method: 'DELETE' })
            .then(function() {
                if (id === currentSessionId) newChat();
                else refreshSessions();
            });
    }
    function refreshSessions() {
        fetch('/api/sessions').then(function(r) { return r.json(); }).then(function(data) {
            var list = document.getElementById('sessionList');
            var sessions = data.sessions || [];
            if (sessions.length === 0) { list.innerHTML = '<div class="empty-sessions">no sessions</div>'; return; }
            var html = '';
            for (var i = 0; i < sessions.length; i++) {
                var s = sessions[i];
                var active = s.sessionId === currentSessionId ? ' active' : '';
                var title = s.title ? s.title : 'new_session';
                html += '<div class="session-item' + active + '" data-id="' + s.sessionId + '">' +
                    '<div class="title">' + escapeHtml(title) + '</div>' +
                    '<div class="meta"><span>' + (s.messageCount || 0) + ' msgs</span><span>' + fmtTime(s.lastActive) + '</span></div>' +
                    '<button class="session-del" data-del="' + s.sessionId + '">×</button></div>';
            }
            list.innerHTML = html;
        });
    }

    function updateStatus() {
        var el = document.getElementById('statusSession');
        el.textContent = currentSessionId ? currentSessionId.substring(0, 8) + '...' : '--';
    }

    // ── Mobile sidebar ──
    function openSidebar() { document.getElementById('sidebar').classList.add('open'); }
    function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }

    // ── Utilities ──
    function formatContent(content) {
        var html = String(content);

        // Escape HTML first
        html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        // Code blocks (must be before other inline formatting)
        html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code class="lang-$1">$2</code></pre>');

        // Inline code
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

        // Bold (** or __)
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>');

        // Italic (* or _)
        html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        html = html.replace(/_([^_]+)_/g, '<em>$1</em>');

        // Headers (### to #)
        html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
        html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
        html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

        // Unordered lists
        html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
        html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');

        // Numbered lists
        html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

        // Line breaks (preserve paragraph structure)
        html = html.replace(/\n/g, '<br>');

        return html;
    }
    function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function fmtTime(s) {
        if (!s) return '';
        try { var d = new Date(s.replace(' ', 'T')); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
        catch(e) { return String(s).slice(11,16); }
    }
    function showToast(msg, isErr) {
        var t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast show' + (isErr ? ' error' : '');
        clearTimeout(t._timer);
        t._timer = setTimeout(function() { t.classList.remove('show'); }, 3000);
    }
    function showConfirm(msg) {
        return new Promise(function(resolve) {
            document.getElementById('dialogBody').textContent = msg;
            document.getElementById('dialogOverlay').classList.add('show');
            function close(val) {
                document.getElementById('dialogOverlay').classList.remove('show');
                resolve(val);
            }
            document.getElementById('dialogOk').onclick = function() { close(true); };
            document.getElementById('dialogCancel').onclick = function() { close(false); };
        });
    }

    // ── Events ──
    document.getElementById('msgInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('newChatBtn').addEventListener('click', newChat);
    document.getElementById('menuToggle').addEventListener('click', openSidebar);
    document.getElementById('clearBtn').addEventListener('click', async function() {
        if (!await showConfirm('clear current conversation?')) return;
        messages = []; currentSessionId = genId(); renderChat(); updateStatus(); showToast('cleared');
    });
    document.getElementById('sessionList').addEventListener('click', function(e) {
        var del = e.target.closest('[data-del]');
        if (del) { e.stopPropagation(); deleteSession(del.getAttribute('data-del')); return; }
        var item = e.target.closest('.session-item');
        if (item) switchSession(item.getAttribute('data-id'));
    });

    // ── Init ──
    refreshSessions();
    fetch('/api/sessions').then(function(r) { return r.json(); }).then(function(data) {
        var sessions = data.sessions || [];
        if (sessions.length > 0) switchSession(sessions[0].sessionId);
        else { currentSessionId = genId(); renderChat(); updateStatus(); }
    }).catch(function() { currentSessionId = genId(); renderChat(); updateStatus(); });
    document.getElementById('msgInput').focus();
})();
</script>
</body>
</html>
