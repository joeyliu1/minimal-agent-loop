<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Loop</title>
    <style>
        :root {
            --bg-base: #f5f7fa;
            --orb-1: rgba(111, 208, 255, 0.18);
            --orb-2: rgba(124, 92, 255, 0.12);
            --orb-3: rgba(255, 120, 180, 0.08);

            --glass-bg: rgba(255, 255, 255, 0.82);
            --glass-bg-strong: rgba(255, 255, 255, 0.92);
            --glass-bg-hover: rgba(255, 255, 255, 0.96);
            --glass-border: rgba(0, 0, 0, 0.08);
            --glass-border-soft: rgba(0, 0, 0, 0.04);

            --blur: 20px;
            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.05);
            --shadow-lift: 0 12px 40px rgba(0, 0, 0, 0.10);

            --r-lg: 24px;
            --r-md: 18px;
            --r-sm: 12px;
            --r-pill: 999px;

            --text-1: rgba(15, 23, 42, 0.92);
            --text-2: rgba(15, 23, 42, 0.50);
            --text-3: rgba(15, 23, 42, 0.30);

            --accent: #3b9eff;
            --accent-strong: #1a7ff5;

            --bubble-user: rgba(59, 158, 255, 0.10);
            --bubble-agent: rgba(255, 255, 255, 0.90);

            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
            background: var(--bg-base);
            color: var(--text-1);
            display: flex; flex-direction: column;
            overflow: hidden; line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .glass-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.7; animation: drift 22s var(--ease) infinite alternate; }
        .orb-1 { width: 46vw; height: 46vw; background: var(--orb-1); top: -10vw; left: -8vw; }
        .orb-2 { width: 40vw; height: 40vw; background: var(--orb-2); bottom: -12vw; right: -6vw; animation-delay: -7s; }
        .orb-3 { width: 30vw; height: 30vw; background: var(--orb-3); top: 30vh; left: 40vw; animation-delay: -14s; }
        @keyframes drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(6vw,4vh) scale(1.15); } }

        .glass-bar {
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(160%);
            backdrop-filter: blur(var(--blur)) saturate(160%);
            border: 1px solid var(--glass-border-soft);
            box-shadow: var(--shadow-glass); position: relative;
        }
        .glass-bar::before {
            content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
            background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0) 45%);
        }

        .top-bar {
            z-index: 3; display: flex; align-items: center; justify-content: space-between;
            padding: 14px 24px; border-radius: 0; border-left: none; border-right: none; border-top: none;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-mark {
            width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 16px;
            background: linear-gradient(135deg, var(--accent), #7c5cff); color: #fff; box-shadow: 0 4px 14px rgba(111,208,255,0.35);
        }
        .top-bar h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.2px; }
        .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 10px rgba(74,222,128,0.75); animation: pulse 2.4s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.42} }

        .icon-btn {
            width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--glass-border-soft);
            background: var(--glass-bg); color: var(--text-1); cursor: pointer; display: grid; place-items: center; font-size: 16px;
            transition: all 0.2s var(--ease); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        }
        .icon-btn:hover { background: var(--glass-bg-hover); }

        .app-body { position: relative; z-index: 1; flex: 1; display: flex; min-height: 0; }
        .chat-shell { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; max-width: 800px; width: 100%; margin: 0 auto; padding: 12px 20px 0; min-height: 0; }
        .chat-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 8px 4px 4px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent; }
        .chat-area::-webkit-scrollbar { width: 5px; }
        .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 99px; }

        .message { display: flex; gap: 11px; align-items: flex-end; max-width: 100%; }
        .message.user { flex-direction: row-reverse; }
        .avatar { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; color: #fff; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
        .message.user .avatar { background: linear-gradient(135deg, #6fd0ff, #4a8cff); }
        .message.agent .avatar { background: linear-gradient(135deg, #b78bff, #7c5cff); }

        .message-content {
            max-width: 72%; padding: 12px 16px; border-radius: var(--r-md); line-height: 1.62; font-size: 14.5px;
            word-break: break-word; animation: bubbleIn 0.38s var(--ease) both;
        }
        .message.user .message-content {
            background: var(--bubble-user); border: 1px solid rgba(111,208,255,0.25);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(150%); backdrop-filter: blur(var(--blur)) saturate(150%);
            box-shadow: var(--shadow-soft); border-radius: var(--r-md) var(--r-md) 6px var(--r-md);
        }
        .message.agent .message-content {
            background: var(--bubble-agent); border: 1px solid var(--glass-border-soft);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(150%); backdrop-filter: blur(var(--blur)) saturate(150%);
            box-shadow: var(--shadow-soft); border-radius: var(--r-md) var(--r-md) var(--r-md) 6px;
        }
        .message-content code { background: rgba(0,0,0,0.28); padding: 1px 6px; border-radius: 6px; font-family: 'SF Mono', ui-monospace, 'Cascadia Code', Menlo, monospace; font-size: 13px; }
        .message-content pre { background: rgba(0,0,0,0.32); padding: 12px; border-radius: 10px; overflow-x: auto; margin: 8px 0; }
        .message-content strong { color: #fff; }
        @keyframes bubbleIn { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .composer { display: flex; gap: 10px; align-items: center; padding: 10px 10px 10px 20px; margin-top: 12px; margin-bottom: 14px; border-radius: var(--r-pill); transition: box-shadow 0.28s var(--ease), background 0.28s; }
        .composer:focus-within { background: var(--glass-bg-strong); box-shadow: var(--shadow-lift), 0 0 0 1px var(--glass-border); }
        #messageInput { flex: 1; border: none; outline: none; background: transparent; color: var(--text-1); font-size: 15px; font-family: inherit; }
        #messageInput::placeholder { color: var(--text-3); }
        #sendBtn { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; display: grid; place-items: center; color: #04121f; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); box-shadow: 0 5px 18px rgba(56,182,255,0.40); transition: transform 0.2s var(--ease), box-shadow 0.2s, opacity 0.2s; }
        #sendBtn:hover:not(:disabled) { transform: scale(1.08); box-shadow: 0 7px 24px rgba(56,182,255,0.55); }
        #sendBtn:active:not(:disabled) { transform: scale(0.94); }
        #sendBtn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

        .typing-wrap { animation: bubbleIn 0.35s var(--ease) both; }
        .typing { display: flex; align-items: center; gap: 9px; color: var(--text-2); font-size: 13px; }
        .typing-dots { display: flex; gap: 5px; }
        .typing-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1.4s infinite ease-in-out; }
        .typing-dots span:nth-child(2) { animation-delay: 0.18s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.36s; }
        @keyframes bounce { 0%,80%,100%{transform:scale(.68);opacity:.35} 40%{transform:scale(1);opacity:1} }

        .toast {
            position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 110px); z-index: 50; max-width: 340px;
            padding: 12px 22px; border-radius: var(--r-pill); font-size: 13.5px; color: var(--text-1);
            opacity: 0; transition: all 0.4s var(--ease); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .toast.show { transform: translate(-50%, 0); opacity: 1; }
        .toast.error { border-color: rgba(255,90,90,0.5); background: rgba(255,85,85,0.12); }

        .clear-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--glass-border); background: transparent; color: var(--text-3); cursor: pointer; display: grid; place-items: center; transition: all 0.2s var(--ease); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 14px; }
        .clear-btn:hover { background: rgba(255,69,69,0.15); color: #ff6b6b; border-color: rgba(255,107,107,0.3); }

        /* ── Drawer ── */
        .drawer {
            flex: 0 0 auto; width: 0; overflow: hidden;
            display: flex; flex-direction: column; background: var(--glass-bg-strong);
            -webkit-backdrop-filter: blur(28px) saturate(175%); backdrop-filter: blur(28px) saturate(175%);
            transition: width 0.42s var(--ease);
        }
        .drawer.open {
            width: 340px; border-right: 1px solid var(--glass-border-soft);
            box-shadow: 2px 0 24px rgba(15, 23, 42, 0.06);
        }
        .drawer-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px; }
        .drawer-header h2 { font-size: 16px; font-weight: 600; }
        .drawer-close { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--glass-border-soft); background: transparent; color: var(--text-2); cursor: pointer; font-size: 15px; display: grid; place-items: center; transition: all 0.2s var(--ease); }
        .drawer-close:hover { background: var(--glass-bg-hover); color: var(--text-1); }
        .drawer-body { flex: 1; overflow-y: auto; padding: 4px 12px 18px; }

        .new-chat-btn { width: 100%; padding: 11px; border: none; border-radius: var(--r-sm); background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow-soft); margin-bottom: 12px; transition: transform 0.2s var(--ease); font-family: inherit; }
        .new-chat-btn:active { transform: scale(0.97); }

        .history-item { position: relative; padding: 11px 36px 11px 12px; border-radius: var(--r-sm); cursor: pointer; border: 1px solid transparent; transition: background 0.18s var(--ease), border-color 0.18s var(--ease); margin-bottom: 4px; }
        .history-item:hover { background: var(--glass-bg-hover); }
        .history-item.active { background: rgba(59, 158, 255, 0.10); border-color: rgba(111, 208, 255, 0.30); }
        .history-title { font-size: 14px; color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-meta { font-size: 11.5px; color: var(--text-3); display: flex; gap: 8px; margin-top: 2px; }
        .history-del { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 50%; border: none; background: transparent; color: var(--text-3); cursor: pointer; font-size: 13px; display: grid; place-items: center; transition: all 0.18s var(--ease); }
        .history-del:hover { background: rgba(255, 69, 69, 0.15); color: #ff6b6b; }

        .empty-hint { color: var(--text-3); font-size: 13px; text-align: center; padding: 26px 8px; }

        /* ── Custom confirm dialog ── */
        .confirm-scrim {
            position: fixed; inset: 0; z-index: 60;
            background: rgba(0, 0, 0, 0.08);
            opacity: 0; visibility: hidden;
            transition: opacity 0.2s var(--ease), visibility 0.2s var(--ease);
        }
        .confirm-scrim.show { opacity: 1; visibility: visible; }
        .confirm-dialog {
            position: fixed; z-index: 62; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.96);
            min-width: 260px; max-width: 320px;
            padding: 28px 24px 20px; border-radius: 14px;
            background: rgba(255, 255, 255, 0.92);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow:
                0 4px 24px rgba(15, 23, 42, 0.10),
                0 1px 3px rgba(15, 23, 42, 0.06),
                inset 0 0.5px 0 rgba(255, 255, 255, 0.8);
            opacity: 0; visibility: hidden;
            transition: all 0.25s var(--ease);
        }
        .confirm-dialog.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
        .confirm-body {
            font-size: 14.5px; color: var(--text-1); line-height: 1.5;
            text-align: center; margin-bottom: 22px; letter-spacing: 0.2px;
        }
        .confirm-actions { display: flex; gap: 12px; justify-content: center; }
        .confirm-btn {
            flex: 1; max-width: 100px; height: 36px; border-radius: 9px; border: none;
            font-size: 13.5px; font-weight: 500; cursor: pointer; font-family: inherit;
            transition: all 0.18s var(--ease); outline: none;
        }
        .confirm-btn.cancel {
            background: rgba(15, 23, 42, 0.06); color: var(--text-2);
        }
        .confirm-btn.cancel:hover { background: rgba(15, 23, 42, 0.11); color: var(--text-1); }
        .confirm-btn.ok {
            background: rgba(59, 158, 255, 0.95); color: #fff;
            box-shadow: 0 1px 6px rgba(59, 158, 255, 0.30);
        }
        .confirm-btn.ok:hover { background: var(--accent-strong); box-shadow: 0 2px 10px rgba(59, 158, 255, 0.45); }
        .confirm-btn.ok:active, .confirm-btn.cancel:active { transform: scale(0.97); }

        @media (max-width: 700px) {
            .top-bar { padding: 12px 16px; }
            .top-bar h1 { font-size: 15px; }
            .chat-shell { padding: 8px 12px 0; }
            .message-content { max-width: 82%; font-size: 14px; padding: 10px 13px; }
            .avatar { width: 30px; height: 30px; font-size: 12px; }
            .composer { padding: 8px 8px 8px 16px; border-radius: 18px; }
            #sendBtn { width: 40px; height: 40px; }
            .toast { left: 12px; right: 12px; transform: translateY(110px); max-width: none; white-space: normal; }
            .toast.show { transform: translateY(0); }
            .drawer.open { width: 78vw; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; } }
    </style>
</head>
<body>

    <div class="glass-bg" aria-hidden="true">
        <span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span>
    </div>

    <header class="glass-bar top-bar">
        <div class="brand">
            <button class="icon-btn" id="menuBtn" aria-label="打开菜单" title="菜单">&#9776;</button>
            <div class="brand-mark">&#9680;</div>
            <h1>Agent Loop</h1>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
            <button class="clear-btn" id="clearBtn" title="清空对话" aria-label="清空对话">&#9003;</button>
            <div class="status"><span class="status-dot"></span><span>在线</span></div>
        </div>
    </header>

    <div class="app-body" id="appBody">
        <aside class="drawer open" id="drawer" aria-hidden="false">
            <div class="drawer-header">
                <h2>菜单</h2>
                <button class="drawer-close" id="drawerClose" aria-label="关闭">&#10005;</button>
            </div>
            <div class="drawer-body">
                <button class="new-chat-btn" id="newChatBtn">＋ 新建对话</button>
                <div id="historyList"></div>
            </div>
        </aside>

        <main class="chat-shell">
            <section class="chat-area" id="chatArea" aria-live="polite"></section>
            <form class="composer glass-bar" id="composer" autocomplete="off">
                <input id="messageInput" type="text" placeholder="给 Agent 发条消息…" aria-label="输入消息">
                <button id="sendBtn" type="submit" aria-label="发送">
                    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-7-8-3z"/></svg>
                </button>
            </form>
        </main>
    </div>

    <div class="toast glass-bar" id="toast" role="status"></div>

    <!-- 自定义确认弹窗 -->
    <div class="confirm-scrim" id="confirmScrim"></div>
    <div class="confirm-dialog" id="confirmDialog" role="alertdialog" aria-modal="true">
        <div class="confirm-body" id="confirmBody"></div>
        <div class="confirm-actions">
            <button class="confirm-btn cancel" id="confirmCancel">取消</button>
            <button class="confirm-btn ok" id="confirmOk">确定</button>
        </div>
    </div>

<script>
(function() {
    var isLoading = false;
    var currentSessionId = null;
    var messages = [];

    function genId() { return 's-' + Date.now() + '-' + Math.random().toString(36).substring(2, 11); }

    // ── Render ──
    function welcomeHtml() {
        return '<div class="message agent"><div class="avatar">AI</div>' +
            '<div class="message-content">你好，我是 Agent Loop。有什么可以帮你的？</div></div>';
    }
    function renderMessage(msg) {
        var avatar = msg.type === 'user' ? 'U' : 'AI';
        return '<div class="message ' + msg.type + '"><div class="avatar">' + avatar + '</div>' +
            '<div class="message-content">' + formatContent(msg.content) + '</div></div>';
    }
    function renderChat() {
        var area = document.getElementById('chatArea');
        if (messages.length === 0) area.innerHTML = welcomeHtml();
        else { var html = ''; for (var i = 0; i < messages.length; i++) html += renderMessage(messages[i]); area.innerHTML = html; }
        area.scrollTop = area.scrollHeight;
    }
    function addMessage(content, type) {
        if (messages.length === 0) document.getElementById('chatArea').innerHTML = '';
        messages.push({ type: type, content: content });
        var area = document.getElementById('chatArea');
        area.insertAdjacentHTML('beforeend', renderMessage({ type: type, content: content }));
        area.scrollTop = area.scrollHeight;
    }

    // ── Send ──
    function sendMessage(msgText) {
        var input = document.getElementById('messageInput');
        var message = msgText || input.value.trim();
        if (!message || isLoading) return;
        if (!currentSessionId) currentSessionId = genId();

        addMessage(message, 'user');
        input.value = '';
        setLoading(true);

        fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message, sessionId: currentSessionId })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) { addMessage(data.response || '无响应', 'agent'); })
        .catch(function(err) { addMessage('请求失败：' + err.message, 'agent'); })
        .finally(function() { setLoading(false); refreshSessions(); });
    }

    function setLoading(loading) {
        isLoading = loading;
        document.getElementById('sendBtn').disabled = loading;
        var area = document.getElementById('chatArea');
        if (loading) {
            var wrap = document.createElement('div');
            wrap.className = 'typing-wrap';
            wrap.innerHTML = '<div class="message agent"><div class="avatar">AI</div>' +
                '<div class="message-content"><div class="typing">' +
                '<div class="typing-dots"><span></span><span></span><span></span></div>思考中</div></div></div>';
            area.appendChild(wrap); area.scrollTop = area.scrollHeight;
        } else {
            var t = area.querySelector('.typing-wrap'); if (t) t.remove();
        }
    }

    // ── Session switching ──
    function newChat() {
        currentSessionId = genId();
        messages = [];
        renderChat();
        refreshSessions();
    }
    function switchSession(id) {
        currentSessionId = id;
        fetch('/api/sessions/' + encodeURIComponent(id) + '/messages')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                messages = (data.messages || []).map(function(m) {
                    return { type: m.role === 'user' ? 'user' : 'agent', content: m.content };
                });
                renderChat();
            })
            .catch(function() { messages = []; renderChat(); });
        refreshSessions();
    }
    async function deleteSession(id) {
        if (!await showConfirm('确定删除这个对话？')) return;
        fetch('/api/sessions?sessionId=' + encodeURIComponent(id), { method: 'DELETE' })
            .then(function() {
                if (id === currentSessionId) newChat();
                else refreshSessions();
            });
    }

    // ── Session list ──
    function refreshSessions() {
        fetch('/api/sessions').then(function(r) { return r.json(); }).then(function(data) {
            var list = document.getElementById('historyList');
            var sessions = data.sessions || [];
            if (sessions.length === 0) { list.innerHTML = '<div class="empty-hint">还没有对话记录</div>'; return; }
            var html = '';
            for (var i = 0; i < sessions.length; i++) {
                var s = sessions[i];
                var active = s.sessionId === currentSessionId ? ' active' : '';
                var title = s.title ? s.title : '（空对话）';
                html += '<div class="history-item' + active + '" data-id="' + s.sessionId + '">' +
                    '<div class="history-title">' + escapeHtml(title) + '</div>' +
                    '<div class="history-meta"><span>' + (s.messageCount || 0) + ' 条</span><span>' + fmtTime(s.lastActive) + '</span></div>' +
                    '<button class="history-del" data-del="' + s.sessionId + '" title="删除">&#10005;</button></div>';
            }
            list.innerHTML = html;
        });
    }

    // ── Drawer ──
    function openDrawer() {
        document.getElementById('drawer').classList.add('open');
        document.getElementById('drawer').setAttribute('aria-hidden', 'false');
    }
    function closeDrawer() {
        document.getElementById('drawer').classList.remove('open');
        document.getElementById('drawer').setAttribute('aria-hidden', 'true');
    }
    function toggleDrawer() {
        if (document.getElementById('drawer').classList.contains('open')) closeDrawer();
        else openDrawer();
    }

    // ── Utilities ──
    function formatContent(content) {
        return String(content)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');
    }
    function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function fmtTime(s) {
        if (!s) return '';
        try {
            var d = new Date(s.replace(' ', 'T'));
            if (isNaN(d.getTime())) return String(s).slice(0, 19);
            var p = function(n) { return (n < 10 ? '0' : '') + n; };
            return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
        } catch (e) { return String(s).slice(0, 19); }
    }
    function showToast(msg, isError) {
        var toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = 'toast glass-bar show' + (isError ? ' error' : '');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 3200);
    }

    // ── Confirm dialog ──
    function showConfirm(message) {
        return new Promise(function(resolve) {
            var scrim = document.getElementById('confirmScrim');
            var dialog = document.getElementById('confirmDialog');
            var body = document.getElementById('confirmBody');
            body.textContent = message;
            dialog.classList.add('show'); scrim.classList.add('show');

            function close(val) {
                dialog.classList.remove('show'); scrim.classList.remove('show');
                setTimeout(function() { resolve(val); }, 200);
            }
            document.getElementById('confirmOk').onclick = function() { close(true); };
            document.getElementById('confirmCancel').onclick = function() { close(false); };
            function onEsc(e) { if (e.key === 'Escape') { document.removeEventListener('keydown', onEsc); close(false); } }
            document.addEventListener('keydown', onEsc);
        });
    }

    // ── Event bindings ──
    var inputEl = document.getElementById('messageInput');
    var composingLockUntil = 0;
    inputEl.addEventListener('compositionstart', function() { inputEl._composing = true; });
    inputEl.addEventListener('compositionend', function() {
        inputEl._composing = false;
        composingLockUntil = Date.now() + 150;
    });

    document.getElementById('composer').addEventListener('submit', function(e) {
        e.preventDefault();
        if (inputEl._composing || Date.now() < composingLockUntil) return;
        sendMessage();
    });

    inputEl.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter' || e.shiftKey) return;
        if (e.isComposing || inputEl._composing || Date.now() < composingLockUntil) return;
        e.preventDefault();
        sendMessage();
    });

    document.getElementById('clearBtn').addEventListener('click', async function() {
        if (!await showConfirm('确定清空当前对话？')) return;
        messages = []; currentSessionId = genId(); renderChat(); showToast('已清空对话');
    });
    document.getElementById('menuBtn').addEventListener('click', toggleDrawer);
    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    document.getElementById('newChatBtn').addEventListener('click', newChat);

    document.getElementById('historyList').addEventListener('click', function(e) {
        var del = e.target.closest('[data-del]');
        if (del) { e.stopPropagation(); deleteSession(del.getAttribute('data-del')); return; }
        var item = e.target.closest('.history-item');
        if (item) switchSession(item.getAttribute('data-id'));
    });

    // ── Init ──
    fetch('/api/sessions').then(function(r) { return r.json(); }).then(function(data) {
        var sessions = data.sessions || [];
        if (sessions.length > 0) switchSession(sessions[0].sessionId);
        else { currentSessionId = genId(); messages = []; renderChat(); }
    }).catch(function() { currentSessionId = genId(); messages = []; renderChat(); });
    document.getElementById('messageInput').focus();
})();
</script>
</body>
</html>
