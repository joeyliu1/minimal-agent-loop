spring:
  application:
    name: minimal-agent-loop

  # MySQL 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/minimal-agent-loop?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  # 通义千问 API配置
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      base-url: ${BASE_URL:https://dashscope.aliyuncs.com}
      chat:
        options:
          model: ${MODEL:qwen3-max}
          temperature: ${TEMPERATURE:0.7}
      embedding:
        # Default v2 has dim 1536 which matches MILVUS_DIMENSION below.
        # If you switch to text-embedding-v3, set MILVUS_DIMENSION=1024 accordingly.
        options:
          model: ${EMBEDDING_MODEL:text-embedding-v2}

  # Milvus 向量数据库配置
  vectorstore:
    milvus:
      client:
        host: localhost
        port: 19530
        username: "" # default: root
        password: "" # default: milvus
      database-name: default
      collection-name: agent_knowledge
      embedding-dimension: ${MILVUS_DIMENSION:1536}
      initializeSchema: true # 自动创建集合

server:
  port: 8085

agent:
  max-steps: 10
  timeout-seconds: 120
  file-read:
    base-dir: ${user.dir}
    max-size: 1048576  # 1 MB

logging:
  level:
    root: INFO
    com.agent: DEBUG
