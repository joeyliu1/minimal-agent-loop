spring:
  application:
    name: minimal-agent-loop

  # MySQL 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/minimal-agent-loop?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  # 通义千问 API配置
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com
      # 当前 SDK 默认仅等待 10 秒；复杂提示可能来不及返回。
      read-timeout: ${DASHSCOPE_READ_TIMEOUT:45}
      chat:
        options:
          model: qwen3.7-max-2026-05-20
          temperature: ${TEMPERATURE:0.1}

server:
  port: 8085

# ═══════════════════════════════════════════════════════════════════════
# Agent 配置
# ═══════════════════════════════════════════════════════════════════════
agent:
  max-steps: 10
  timeout-seconds: 120
  step-timeout-ms: 30000
  # 每步 LLM 调用的重试次数
  llm-retries: 2
  # 工具调用的最大重试次数
  tool-retries: 2
  file-read:
    base-dir: ${user.dir}
    max-size: 1048576  # 1 MB

# ═══════════════════════════════════════════════════════════════════════
# Actuator (health, metrics)
# ═══════════════════════════════════════════════════════════════════════
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

# ═══════════════════════════════════════════════════════════════════════
# Resilience4j
# ═══════════════════════════════════════════════════════════════════════
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2
  ratelimiter:
    configs:
      default:
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 50ms

logging:
  level:
    root: INFO
    com.agent: DEBUG
    # 打开 resilience4j 的详细日志
    io.github.resilience4j: INFO
  pattern:
    # 在日志中显示 traceId 和 sessionId
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%mdc{traceId:-no-trace}] - %msg%n"
